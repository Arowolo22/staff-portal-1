<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign Up – Olajide Tech Ltd</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase Authentication Web SDK and configuration -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="firebase/firebase.js"></script>
    <script src="js/localapi.js"></script>
    <script src="js/common.js"></script>
</head>
<body class="auth">
    <div class="auth-card">
        <img src="images/Logo-1.png" alt="logo" width="120px">
        <div class="co">Olajide Tech ltd.</div>
        <h1>STAFF PORTAL</h1>
        <h2>Sign Up</h2>
        <form id="signupForm" novalidate>
            <label for="fullName">Full name:</label>
            <input id="fullName" maxlength="100" autocomplete="name">
            <label for="username">Username:</label>
            <input id="username" maxlength="30" autocomplete="username">
            <label for="email">E-mail:</label>
            <input id="email" type="email" maxlength="150" autocomplete="email">
            <label for="password">Password:</label>
            <input id="password" type="password" autocomplete="new-password">
            <label for="confirmPassword">Confirm password:</label>
            <input id="confirmPassword" type="password" autocomplete="new-password">
            <button class="submit" id="signupBtn" type="submit">Create Account</button>
            <div class="msg" id="formMessage"></div>
        </form>
        <p style="font-size:12px;margin:4px 0">Already have an account?</p>
        <a class="signin" href="login.html">Log in</a>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
